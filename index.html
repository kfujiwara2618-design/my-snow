<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Luxury Pro AR Camera - Snow HD (JPG & Face Detection)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #000;
      touch-action: none;
    }
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      transform-origin: center center;
      transition: transform 0.2s ease-out;
    }
    #ar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    #ar-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #top-controls {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(15, 15, 15, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 12px;
      border-radius: 25px;
      border: 1px solid rgba(228, 195, 139, 0.4);
      z-index: 10;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      align-items: center;
    }
    .control-btn {
      background: transparent;
      border: 1px solid rgba(228, 195, 139, 0.5);
      color: #f7f3ed;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 10px;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
    #info-overlay {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(247, 243, 237, 0.75);
      font-size: 9.5px;
      letter-spacing: 0.08em;
      z-index: 10;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    #status { font-weight: 500; color: #e4c38b; }
    #shutter-container {
      position: absolute;
      bottom: 40px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    #shutter-btn {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffffff 0%, #d8c4b6 50%, #b8977e 100%);
      border: 3px solid rgba(228, 195, 139, 0.95);
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(0,0,0,0.7), inset 0 2px 6px rgba(255,255,255,0.95);
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.15s ease;
      outline: none;
    }
    #shutter-btn:active {
      transform: scale(0.92);
      box-shadow: 0 5px 15px rgba(0,0,0,0.5), inset 0 1px 3px rgba(0,0,0,0.4);
    }
  </style>
  <!-- Face-api.js の読み込み (人物認識用) -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="top-controls">
    <button class="control-btn" id="effect-btn" onclick="toggleEffectPower()">FX: Mid</button>
    <div style="width: 1px; height: 16px; background: rgba(228,195,139,0.3); margin: 0 2px;"></div>
    <button class="control-btn" onclick="switchCamera()">Cam ⟳</button>
  </div>

  <div id="info-overlay">
    PRO MODE: <span id="status">MODEL LOADING...</span> | JPG保存 | 顔認識エフェクト回避
  </div>

  <div id="ar-layer">
    <canvas id="ar-canvas"></canvas>
  </div>

  <div id="shutter-container">
    <button id="shutter-btn" title="Capture"></button>
  </div>

  <script>
    const webcamEl = document.getElementById('webcam');
    const statusEl = document.getElementById('status');
    const arCanvas = document.getElementById('ar-canvas');
    const ctx = arCanvas.getContext('2d');
    const shutterBtn = document.getElementById('shutter-btn');

    let currentZoom = 1;
    const MIN_ZOOM = 1;
    const MAX_ZOOM = 10;
    let useFrontCamera = false;
    let currentStream = null;
    let faces = []; // 認識された顔の情報を格納する配列

    function applyZoom(level) {
      currentZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, level));
      webcamEl.style.transform = `scale(${currentZoom})`;
    }

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const constraints = {
          video: {
            facingMode: useFrontCamera ? "user" : { exact: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        };
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        webcamEl.srcObject = currentStream;

        webcamEl.onloadedmetadata = () => {
          startFaceDetection();
          statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
        };
      } catch (err) {
        try {
          const fallbackConstraints = { video: true, audio: false };
          currentStream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
          webcamEl.srcObject = currentStream;

          webcamEl.onloadedmetadata = () => {
            startFaceDetection();
            statusEl.textContent = "READY";
          };
        } catch (e) {
          statusEl.textContent = "CAMERA ERROR";
          console.error(e);
        }
      }
    }

    function switchCamera() {
      useFrontCamera = !useFrontCamera;
      initCamera();
    }

    // --- 顔認識 (Face-api.js) の実装 ---
    async function loadModels() {
      const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
      await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
      statusEl.textContent = "MODEL LOADED";
    }

    async function startFaceDetection() {
      if (!faceapi.nets.tinyFaceDetector.params) {
        await loadModels();
      }
      detectFaces();
    }

    async function detectFaces() {
      if (webcamEl.paused || webcamEl.ended || !faceapi.nets.tinyFaceDetector.params) {
        requestAnimationFrame(detectFaces);
        return;
      }

      const detections = await faceapi.detectAllFaces(webcamEl, new faceapi.TinyFaceDetectorOptions());
      const displaySize = { width: arCanvas.width / dpr, height: arCanvas.height / dpr };
      faces = faceapi.resizeResults(detections, displaySize);

      requestAnimationFrame(detectFaces);
    }

    // --- ピンチズームの実装 ---
    let initialPinchDistance = null;
    let zoomStartValue = 1;

    function getPinchDistance(touches) {
      if (touches.length < 2) return 0;
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDistance = getPinchDistance(e.touches);
        zoomStartValue = currentZoom;
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance !== null) {
        const currentDistance = getPinchDistance(e.touches);
        if (initialPinchDistance > 0) {
          const distanceRatio = currentDistance / initialPinchDistance;
          const newZoom = zoomStartValue * distanceRatio;
          applyZoom(newZoom);
        }
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        initialPinchDistance = null;
      }
    });

    // --- 高解像度 (Retina) 対応のCanvasリサイズ処理 ---
    let dpr = window.devicePixelRatio || 1;

    function resizeCanvas() {
      dpr = window.devicePixelRatio || 1;
      const width = window.innerWidth;
      const height = window.innerHeight;

      arCanvas.width = width * dpr;
      arCanvas.height = height * dpr;
      arCanvas.style.width = width + 'px';
      arCanvas.style.height = height + 'px';
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- エフェクト強弱設定 ---
    let effectPowerLevel = 2; // 1: Low, 2: Mid, 3: High
    function toggleEffectPower() {
      effectPowerLevel = (effectPowerLevel % 3) + 1;
      const names = { 1: 'Low', 2: 'Mid', 3: 'High' };
      document.getElementById('effect-btn').textContent = `FX: ${names[effectPowerLevel]}`;
    }

    // --- ラグジュアリー雪の結晶・粉雪パーティクルシステム ---
    const particles = [];
    const snowColors = [
      '#FFFFFF', '#F0F8FF', '#E6F2FF', '#E0FFFF', 
      '#FAF0E6', '#FFF8DC', '#E8F5E9'
    ];

    for (let i = 0; i < 140; i++) {
      const isLargeFlake = Math.random() < 0.25; // 25%の確率で繊細な雪の結晶（大）
      particles.push({
        type: isLargeFlake ? 'flake' : 'dust',
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: isLargeFlake ? (Math.random() * 12 + 10) : (Math.random() * 3.5 + 1.2),
        speedY: isLargeFlake ? (Math.random() * 0.8 + 0.5) : (Math.random() * 1.8 + 0.6),
        speedX: (Math.random() - 0.5) * 0.8,
        swaySpeed: Math.random() * 0.02 + 0.01,
        swayAmp: Math.random() * 1.5 + 0.5,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.02,
        opacity: Math.random() * 0.5 + 0.4,
        color: snowColors[Math.floor(Math.random() * snowColors.length)],
        sparkleSpeed: Math.random() * 0.05 + 0.02,
        onFace: false
      });
    }

    let timeCount = 0;

    // 結晶（雪の結晶）を描画する関数
    function drawSnowFlake(ctx, p, drawOpacity) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = drawOpacity;

      // ラグジュアリーなグロー効果（発光）
      ctx.shadowBlur = p.size * 0.8;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
      ctx.strokeStyle = p.color;
      ctx.fillStyle = p.color;
      ctx.lineWidth = 1.2;

      const r = p.size;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, -r);
        ctx.stroke();

        // 枝部分
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.5);
        ctx.lineTo(r * 0.25, -r * 0.7);
        ctx.moveTo(0, -r * 0.5);
        ctx.lineTo(-r * 0.25, -r * 0.7);
        ctx.stroke();

        ctx.rotate(Math.PI / 3);
      }

      // 中心部の輝くダイヤコア
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // 粉雪・ダイヤモンドダストを描画する関数
    function drawDust(ctx, p, drawOpacity) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = drawOpacity;

      // キラキラ光る閃光演出
      const sparkle = Math.sin(timeCount * 10 * p.sparkleSpeed) * 0.3 + 0.7;
      const currentSize = p.size * sparkle;

      ctx.shadowBlur = currentSize * 2.5;
      ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
      ctx.fillStyle = p.color;

      ctx.beginPath();
      ctx.arc(0, 0, currentSize, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // --- メイン描画ループ ---
    function renderLoop() {
      timeCount += 0.016;
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      ctx.clearRect(0, 0, logicalWidth, logicalHeight);

      const activeCount = effectPowerLevel === 1 ? 0.4 : (effectPowerLevel === 2 ? 0.7 : 1.2);

      particles.forEach((p) => {
        // 雪のゆっくりとした降下＆横揺れ
        p.y += p.speedY * activeCount;
        p.x += (p.speedX + Math.sin(timeCount * p.swaySpeed) * p.swayAmp) * activeCount;
        p.rotation += p.rotSpeed;

        // 画面外リセット
        if (p.y > logicalHeight + 30 || p.x < -30 || p.x > logicalWidth + 30) {
          p.y = -30;
          p.x = Math.random() * logicalWidth;
          p.color = snowColors[Math.floor(Math.random() * snowColors.length)];
        }

        // --- 顔認識回避ロジック ---
        p.onFace = false;
        if (faces.length > 0) {
          for (const face of faces) {
            const { x, y, width, height } = face.box;
            if (p.x > x && p.x < x + width && p.y > y && p.y < y + height) {
              p.onFace = true;
              break;
            }
          }
        }

        const drawOpacity = p.onFace ? p.opacity * 0.1 : p.opacity;

        // エフェクト描画
        if (effectPowerLevel > 0) {
          if (p.type === 'flake') {
            drawSnowFlake(ctx, p, drawOpacity);
          } else {
            drawDust(ctx, p, drawOpacity);
          }
        }
      });

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // --- シャッター機能（保存形式JPG、自動保存） ---
    shutterBtn.addEventListener('click', () => {
      const saveCanvas = document.createElement('canvas');
      const logicalWidth = window.innerWidth;
      const logicalHeight = window.innerHeight;

      saveCanvas.width = logicalWidth * dpr;
      saveCanvas.height = logicalHeight * dpr;
      const saveCtx = saveCanvas.getContext('2d');
      saveCtx.scale(dpr, dpr);

      // 1. カメラ映像を描画
      if (webcamEl.readyState === webcamEl.HAVE_ENOUGH_DATA) {
        const vW = webcamEl.videoWidth;
        const vH = webcamEl.videoHeight;
        const vRatio = vW / vH;
        const cRatio = logicalWidth / logicalHeight;

        let dw = logicalWidth, dh = logicalHeight, dx = 0, dy = 0;
        if (vRatio > cRatio) {
          dw = logicalHeight * vRatio;
          dx = (logicalWidth - dw) / 2;
        } else {
          dh = logicalWidth / vRatio;
          dy = (logicalHeight - dh) / 2;
        }

        saveCtx.save();
        saveCtx.translate(logicalWidth / 2, logicalHeight / 2);
        saveCtx.scale(currentZoom, currentZoom);
        saveCtx.translate(-logicalWidth / 2, -logicalHeight / 2);
        saveCtx.drawImage(webcamEl, dx, dy, dw, dh);
        saveCtx.restore();
      }

      // 2. AR演出（雪の結晶・粉雪）を合成
      saveCtx.drawImage(arCanvas, 0, 0, logicalWidth, logicalHeight);

      // 3. JPG保存
      const jpgDataUrl = saveCanvas.toDataURL('image/jpeg', 0.9);
      const link = document.createElement('a');
      link.download = 'luxury_pro_snow_' + Date.now() + '.jpg';
      link.href = jpgDataUrl;
      link.click();

      statusEl.textContent = "JPG SAVED (Check Library)";

      setTimeout(() => {
        statusEl.textContent = useFrontCamera ? "FRONT CAM" : "BACK CAM";
      }, 3000);
    });

    // 初期化
    initCamera();

  </script>
</body>
</html>
